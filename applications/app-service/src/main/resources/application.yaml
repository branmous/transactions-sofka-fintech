server:
  port: 8080
spring:
  application:
    name: "baseProject"
  devtools:
    add-properties: false
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: "/h2-console"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
mysql:
  datasource:
    db: "transactionsdb"
    host-and-port: "h2:mem"
    username: "sa"
    password: ""
    driver: "h2"
    protocol: "mem"
    connection-pool:
      acquire-retry: 3
      min-idle: 10
      max-idle-time: 10
      background-eviction-interval: 10
      validation-query: "SELECT 1"
adapter:
  restconsumer:
    timeout: 5000
    url: "https://jsonplaceholder.typicode.com"
